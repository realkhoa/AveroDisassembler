id = "rizin"
name = "Rizin"
version = "0.9.1"
license = "LGPL-3.0"
integration = "sidecar"
homepage = "https://github.com/rizinorg/rizin"
binaries = ["rizin"]
install_dir = "engines/rizin/0.9.1"

[install]
method = "zip"

[download.windows-x64]
url = "https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-windows-shared64-v0.9.1.zip"
sha256 = "45ffa004e26653eaee8d262b8e6eeae09402a7d319c1f20a2ba794bd6af1cc28"
archive = "zip"

[download.linux-x64]
url = "https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-v0.9.1-static-x86_64.tar.xz"
sha256 = "PIN_BEFORE_SHIPPING"
archive = "tar.xz"

[healthcheck]
command = ["rizin", "-v"]
timeout_s = 30

[notes]
role = "Batch disassembly/CFG, JSON output via -j (secondary engine, fast for batches)"
