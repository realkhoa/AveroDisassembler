id = "ghidra"
name = "Ghidra"
version = "12.2"
license = "Apache-2.0"
integration = "sidecar"
homepage = "https://github.com/NationalSecurityAgency/ghidra"
requires = ["jdk>=25"]
binaries = ["analyzeHeadless"]
install_dir = "engines/ghidra/12.2"

[install]
method = "zip"

[download.windows-x64]
url = "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip"
sha256 = "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
archive = "zip"

[healthcheck]
command = ["analyzeHeadless", "-help"]
timeout_s = 60

[notes]
role = "Native decompiler + deep analysis (primary engine for P2); Ghidra 12.2 requires JDK 25+"
