name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            artifact: avero-windows-x64
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            name: Linux x64
            artifact: avero-linux-x64
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            name: macOS arm64
            artifact: avero-macos-arm64
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build (debug, cached for tests)
        run: cargo build --locked

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/avero.exe" dist/avero.exe
          Compress-Archive -Path dist/avero.exe -DestinationPath "dist/${{ matrix.artifact }}.zip" -Force
          $hash = (Get-FileHash "dist/${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Set-Content -NoNewline "dist/${{ matrix.artifact }}.sha256"
          Get-ChildItem dist | Select-Object Name, Length

      - name: Package release artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/avero" dist/avero
          chmod +x dist/avero
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist avero
          # Normalize the checksum file so it contains only the relative archive name.
          (cd dist && sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256")
          ls -l dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Desktop app (Tauri, Windows x64)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm --filter desktop build

      - name: Build Tauri desktop app
        run: pnpm --filter desktop exec tauri build --no-bundle

      - name: Package desktop artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "apps/desktop/src-tauri/target/release/avero-desktop.exe" dist/avero-desktop.exe
          $hash = (Get-FileHash dist/avero-desktop.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  avero-desktop.exe" | Set-Content -NoNewline dist/avero-desktop.exe.sha256
          Compress-Archive -Path dist/avero-desktop.exe -DestinationPath dist/avero-desktop-windows-x64.zip -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: avero-desktop-windows-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -l release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
