[package]
name = "avero"
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
description = "Avero RE workbench — fast, evidence-first triage and analysis for native, managed, mobile and game binaries"
license = "MIT"
default-run = "avero"

[[bin]]
name = "avero"
path = "src/main.rs"

[lib]
name = "avero"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
colored = "3"
comfy-table = "8"
flate2 = "1"
goblin = "0.10"
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
tiny_http = "0.12"
toml = "1"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
