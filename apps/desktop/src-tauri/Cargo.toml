[package]
name = "avero-desktop"
version = "0.14.0"
description = "AveroDisassembler desktop workbench"
edition = "2021"
rust-version = "1.77"

[lib]
name = "avero_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
